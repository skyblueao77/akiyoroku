    <script>
      // Gracefully prevent unhandled websocket rejections from breaking the preview iframe
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var message = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          message.indexOf('WebSocket') !== -1 ||
          message.indexOf('websocket') !== -1 ||
          (reason && reason.name === 'WebSocketError')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var message = (event && (event.message || '')) || '';
        if (
          message.indexOf('WebSocket') !== -1 ||
          message.indexOf('websocket') !== -1
        ) {
          event.preventDefault();
        }
      });
    </script>
